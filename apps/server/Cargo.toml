[package]
name = "crumbvote-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
crumbvote-database = { version = "0.1.0", path = "../../crates/database" }
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "fs"] }
tower-http = { version = "0.7.0", default-features = false, features = ["fs"] }
